openapi: 3.0.0
paths:
  /api/v2:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - app
  /api/v2/hmac:
    get:
      operationId: AppController_getHmac
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - app
  /api/v2/comment:
    get:
      operationId: CommentController_getComment
      parameters:
        - name: where
          required: true
          in: query
          description: Where to get
          schema:
            type: string
      responses:
        '201':
          description: Comment Elements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentGetResponseDto'
      summary: Get Comment
      tags:
        - comment
    post:
      operationId: CommentController_postComment
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentPostDto'
      responses:
        '201':
          description: ''
      summary: Post Comment
      tags:
        - comment
  /api/v2/comment/{id}/hidden:
    patch:
      operationId: CommentController_toggleCommentHidden
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      summary: Toggle comment hidden status
      tags:
        - comment
  /api/v2/user:
    get:
      operationId: UserController_getCurrentUser
      parameters: []
      responses:
        '201':
          description: User Information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      summary: Get current user information
      tags:
        - user
    post:
      operationId: UserController_registerUser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterDTO'
      responses:
        '201':
          description: ''
      summary: Register User
      tags:
        - user
  /api/v2/user/list:
    get:
      operationId: UserController_getAllUsers
      parameters: []
      responses:
        '201':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
      summary: Get all users
      tags:
        - user
  /api/v2/user/discord:
    get:
      operationId: UserController_listDiscordUserAppIds
      parameters: []
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDiscordUserAppIdsResponseDto'
      summary: Get userAppIds registered by discord id
      tags:
        - user
  /api/v2/auth:
    post:
      operationId: AuthController_logIn
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterDTO'
      responses:
        '201':
          description: jwt token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
      summary: Login
      tags:
        - auth
    delete:
      operationId: AuthController_logout
      parameters: []
      responses:
        '200':
          description: ''
      summary: Logout
      tags:
        - auth
  /api/v2/auth/refresh:
    get:
      operationId: AuthController_refreshToken
      parameters: []
      responses:
        '201':
          description: jwt token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResLoginUser'
      summary: Get refresh token
      tags:
        - auth
  /api/v2/auth/discord:
    get:
      operationId: AuthController_logInDiscord
      parameters: []
      responses:
        '200':
          description: ''
      summary: Login From Discord
      tags:
        - auth
  /api/v2/auth/discord/redirect:
    get:
      operationId: AuthController_redirect
      parameters: []
      responses:
        '200':
          description: ''
      summary: Redirect discord oauth2
      tags:
        - auth
  /api/v2/view:
    get:
      operationId: ViewController_get
      parameters:
        - name: offset
          required: true
          in: query
          description: Offset
          schema:
            type: integer
        - name: count
          required: true
          in: query
          description: Count
          schema:
            type: integer
        - name: type
          required: false
          in: query
          description: Type
          schema:
            type: string
      responses:
        '201':
          description: View Result (Article, Count)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewGetResponseDto'
      summary: Get article read view
      tags:
        - view
    post:
      operationId: ViewController_post
      parameters:
        - name: articleId
          required: true
          in: query
          description: ArticleId
          schema:
            type: integer
        - name: viewSeconds
          required: true
          in: query
          description: Count
          schema:
            type: integer
        - name: userAppId
          required: true
          in: query
          description: User App Id
          schema:
            type: string
      responses:
        '201':
          description: ''
      summary: Post article read data
      tags:
        - view
  /api/v2/view/logined:
    post:
      operationId: ViewController_postLogined
      parameters:
        - name: articleId
          required: true
          in: query
          description: ArticleId
          schema:
            type: integer
        - name: viewSeconds
          required: true
          in: query
          description: Count
          schema:
            type: integer
        - name: userAppId
          required: true
          in: query
          description: User App Id
          schema:
            type: string
      responses:
        '201':
          description: ''
      summary: Post article read data
      tags:
        - view
  /api/v2/stats:
    get:
      operationId: StatsController_getStats
      parameters: []
      responses:
        '200':
          description: 통계 데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponseDto'
      summary: 통계 데이터 조회
      tags:
        - stats
  /api/v2/bookmark/backup:
    post:
      operationId: BookmarkController_createBookmarkBackup
      parameters: []
      responses:
        '201':
          description: ''
      summary: Create Bookmark Backup
      tags:
        - bookmark
  /api/v2/bookmark:
    get:
      operationId: BookmarkController_getUserBookmarks
      parameters: []
      responses:
        '200':
          description: ''
      summary: Get User Bookmarks
      tags:
        - bookmark
info:
  title: Violet Server API Docs
  description: Violet Server API description
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    CommentGetResponseDtoElement:
      type: object
      properties:
        id:
          type: integer
          description: Comment Id
        userAppId:
          type: string
          description: Body
        body:
          type: string
          description: Body
        dateTime:
          format: date-time
          type: string
          description: Write DateTime
        parent:
          type: integer
          description: Parent Comment
      required:
        - id
        - userAppId
        - body
        - dateTime
    CommentGetResponseDto:
      type: object
      properties:
        elements:
          description: Comment Elements
          type: array
          items:
            $ref: '#/components/schemas/CommentGetResponseDtoElement'
      required:
        - elements
    CommentPostDto:
      type: object
      properties:
        where:
          type: string
          description: Where to post
        body:
          type: string
          description: Post Body
        parent:
          type: integer
          description: Parent Comment
      required:
        - where
        - body
    User:
      type: object
      properties:
        id:
          type: number
          description: Id
        createdAt:
          format: date-time
          type: string
          description: Created At
        updatedAt:
          format: date-time
          type: string
          description: Update At
        userAppId:
          type: string
          description: User Id
        role:
          type: string
          description: User Role
          enum:
            - admin
            - user
          default: user
        discordId:
          type: string
          description: Discord Id
        avatar:
          type: string
          description: Avatar
        nickname:
          type: string
          description: Nickname
      required:
        - id
        - createdAt
        - updatedAt
        - userAppId
        - role
        - discordId
        - avatar
        - nickname
    UserRegisterDTO:
      type: object
      properties:
        userAppId:
          type: string
          description: User App Id
      required:
        - userAppId
    ListDiscordUserAppIdsResponseDto:
      type: object
      properties:
        userAppIds:
          description: User App Ids
          type: array
          items:
            type: string
      required:
        - userAppIds
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
          description: accessToken
        refreshToken:
          type: string
          description: refreshToken
      required:
        - accessToken
        - refreshToken
    ResLoginUser:
      type: object
      properties: {}
    ViewGetResponseDtoElement:
      type: object
      properties:
        articleId:
          type: integer
          description: Article Id
        count:
          type: integer
          description: Count
      required:
        - articleId
        - count
    ViewGetResponseDto:
      type: object
      properties:
        elements:
          description: View Get Elements
          type: array
          items:
            $ref: '#/components/schemas/ViewGetResponseDtoElement'
      required:
        - elements
    StatsResponseDto:
      type: object
      properties:
        totalUsers:
          type: integer
          description: 총 사용자 수
        totalComments:
          type: integer
          description: 총 댓글 수
        userGrowth:
          type: object
          description: 사용자 성장 데이터
        commentGrowth:
          type: object
          description: 댓글 성장 데이터
      required:
        - totalUsers
        - totalComments
        - userGrowth
        - commentGrowth
