name: violet-web CD

on:
  pull_request:
    branches:
      - "dev"
  merge_group:
  workflow_dispatch:

jobs:
  web-changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - ".github/workflows/violet-web-cd.yml"
              - "violet-web/**"

  deploy-by-docker:
    needs: web-changes
    if: ${{ needs.web-changes.outputs.src == 'true' || github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:violet-web"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: violetdev/violet-web:latest

      - name: Deploy
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.WEBHOOK_URL }}
          method: "POST"
          timeout: 60000

      - name: CD Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Success Deploy! (violet-web)"
          color: 0x28e1ff
          nodetail: true
          description: |
            Commit: [${{ github.event.head_commit.message }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            CI Log: [${{ github.ref }} / ${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: CD Fail
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Failed to Deploy (violet-web)"
          nodetail: true
          color: 0xff9300
          content: "<@614104830738169877>"
          description: |
            Commit: [${{ github.event.head_commit.message }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            CI Log: [${{ github.ref }} / ${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
